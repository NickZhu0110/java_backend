spring:
  application:
    name: cac-backend

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://localhost:5432/cac_platform
    username: nick
    password:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled : true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

app:
  analysis:
    mode: ${APP_ANALYSIS_MODE:kafka}
    local-direct:
      python-exe: ${SEGMENTCACS_PYTHON_EXE:}
      wrapper-path: ${SEGMENTCACS_WRAPPER:}
      segmentcacs-src: ${SEGMENTCACS_SRC:}
      model-path: ${MODEL_PATH:}
      file-type: ${SEGMENTCACS_FILE_TYPE:dcm}
      device: ${DEVICE:cpu}
      use-zero-module: ${USE_ZERO_MODULE:false}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
